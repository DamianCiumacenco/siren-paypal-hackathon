# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Free plan (spins down after 15 min idle — UptimeRobot pings /health every 5 min to keep it
# awake, which also keeps the in-process nag scheduler running).
services:
  - type: web
    name: siren
    runtime: node
    plan: free
    region: frankfurt # closest Render region to Supabase eu-west (Dublin)
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # PayPal (sandbox only)
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID # from PayPal dashboard → app → Webhooks (after the first deploy)
        sync: false
      # NEVER set PAYPAL_WEBHOOK_ALLOW_SIMULATOR here — anyone can fire the simulator at us.
      # Telegram
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # LLM failover chain: Groq → Gemini → NVIDIA
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # App
      - key: NAG_CRON_INTERVAL
        value: "0 */6 * * *"
      - key: PUBLIC_URL # the service's own https://….onrender.com URL (Telegram webhook mode)
        sync: false
